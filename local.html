<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿瓦隆 - 单机版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e8e6e3; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    h1 { text-align: center; color: #c9a227; margin-bottom: 16px; }
    .card { background: #12121a; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid rgba(201,162,39,0.3); }
    .btn { background: #c9a227; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; font-weight: 600; }
    .btn:hover { background: #e8c547; }
    input { background: #1a1a25; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; width: 100%; margin-bottom: 12px; }
    .player-list { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .player { background: #1a1a25; padding: 8px 14px; border-radius: 20px; border: 1px solid #333; }
    .role { display: inline-block; background: #c9a227; color: #000; padding: 6px 14px; border-radius: 6px; margin: 4px; font-weight: 600; }
    .role.evil { background: #dc2626; color: #fff; }
    .hidden { display: none; }
    .host-msg { background: #1a1a25; border-left: 3px solid #f59e0b; padding: 16px; border-radius: 0 8px 8px 0; margin-bottom: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏰 阿瓦隆 - 单机版</h1>
    <p style="text-align:center;color:#888;font-size:13px;margin-bottom:16px">同一台电脑，轮流来玩</p>
    
    <div id="setup-screen" class="card">
      <input type="text" id="player-name" placeholder="你的名字" value="玩家" />
      <button class="btn" onclick="createGame()">创建游戏</button>
    </div>
    
    <div id="game-screen" class="card hidden">
      <div class="host-msg" id="message">游戏进行中...</div>
      <div class="player-list" id="players"></div>
      <div id="role-area" class="hidden">
        <p style="color:#888;margin-bottom:8px">你的角色：</p>
        <div id="my-role"></div>
      </div>
      <button class="btn" onclick="nextPhase()" style="margin-top:16px">下一步 ➡️</button>
      <button class="btn" onclick="resetGame()" style="margin-top:8px;background:#444;color:#fff">重置游戏</button>
    </div>
  </div>

  <script>
    // Game state
    let gameState = JSON.parse(localStorage.getItem('avalon') || 'null');
    const roles = ['Merlin', 'Percival', 'Loyal Servant', 'Loyal Servant', 'Minon'];
    const evilRoles = ['Assassin', 'Mordred'];
    let phase = 0;
    
    function save() {
      localStorage.setItem('avalon', JSON.stringify(gameState));
    }
    
    function createGame() {
      const name = document.getElementById('player-name').value || '玩家';
      gameState = {
        players: [{name, role: null}],
        phase: 'setup',
        round: 1,
        leader: 0,
        message: '等待玩家加入...\n\n请轮流输入名字并点击"添加玩家"'
      };
      save();
      showGame();
    }
    
    function addPlayer() {
      const name = prompt('输入玩家名字:');
      if (!name) return;
      gameState.players.push({name, role: null});
      if (gameState.players.length === 5) {
        gameState.message = '已满5人！点击"发牌"开始';
      }
      save();
      render();
    }
    
    function dealCards() {
      // Simple random role assignment
      const allRoles = [...roles];
      gameState.players.forEach((p, i) => {
        const idx = Math.floor(Math.random() * allRoles.length);
        p.role = allRoles.splice(idx, 1)[0];
      });
      gameState.phase = 'roles';
      gameState.message = '🔔 所有人查看角色！\n\n好人找梅林，坏人找莫德雷德\n\n点击"下一步"继续';
      save();
      render();
    }
    
    function nextPhase() {
      if (gameState.phase === 'setup') {
        if (gameState.players.length < 3) {
          alert('需要至少3个玩家！');
          return;
        }
        // Fill with AI
        while (gameState.players.length < 5) {
          gameState.players.push({name: 'AI' + (gameState.players.length), role: 'AI', isAI: true});
        }
        dealCards();
      } else if (gameState.phase === 'roles') {
        gameState.phase = 'teambuild';
        gameState.message = '👑 第1轮\n\n队伍领袖选择4人执行任务\n(单机版跳过队伍选择，直接任务)';
        gameState.round = 1;
      } else if (gameState.phase === 'teambuild') {
        // Simple voting - random pass/fail
        const fail = Math.random() < 0.3;
        gameState.message = fail ? '❌ 任务失败！' : '✅ 任务成功！';
        if (gameState.round >= 3 || fail) {
          gameState.message += '\n\n🏆 游戏结束！';
        } else {
          gameState.round++;
        }
      }
      save();
      render();
    }
    
    function showGame() {
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      render();
    }
    
    function render() {
      document.getElementById('message').textContent = gameState.message;
      document.getElementById('players').innerHTML = gameState.players.map(p => 
        '<span class="player">' + p.name + '</span>'
      ).join('');
      
      // Show roles if revealed
      if (gameState.phase === 'roles') {
        const mainPlayer = gameState.players[0]; // First player is you
        if (mainPlayer.role) {
          document.getElementById('role-area').classList.remove('hidden');
          const isEvil = ['Minon', 'Mordred', 'Assassin'].includes(mainPlayer.role);
          document.getElementById('my-role').innerHTML = 
            '<span class="role' + (isEvil ? ' evil' : '') + '">' + mainPlayer.role + '</span>';
        }
      }
    }
    
    function resetGame() {
      localStorage.removeItem('avalon');
      gameState = null;
      document.getElementById('setup-screen').classList.remove('hidden');
      document.getElementById('game-screen').classList.add('hidden');
    }
    
    // Add player button if game exists
    if (gameState && gameState.phase === 'setup') {
      // Add button dynamically
    }
  </script>
  <button class="btn" onclick="addPlayer()" style="margin-top:12px">添加玩家 +</button>
</body>
</html>
